<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">SeedBox front panel control map</title>
  <desc id="desc">Four encoders with integrated switches: Seed/Bank, Density, Tone/Tilt, FX/Mutate. Four standalone buttons: Tap Tempo, Shift, Alt Seed, Live Capture. Wiring follows include/hal/PanelControls.h. Schematic layout, not a drilling template.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #202934; text-anchor: middle; }
    .panel { fill: #f4f5f7; stroke: #2d2d2d; stroke-width: 2; }
    .encoder { fill: #dfe6ed; stroke: #2d2d2d; stroke-width: 2; }
    .button { fill: #ffecc7; stroke: #2d2d2d; stroke-width: 2; }
    .jack { fill: #d9f2e6; stroke: #2d2d2d; stroke-width: 2; }
    .label { font-size: 14px; font-weight: bold; }
    .hint { font-size: 12px; }
  </style>
  <rect x="40" y="40" width="640" height="360" rx="18" class="panel"/>
  <text x="150" y="85" class="label">SeedBox</text>
  <rect x="290" y="65" width="160" height="65" rx="6" fill="#0e1116"/>
  <text x="370" y="102" style="fill:#c3f7d1" class="hint">OLED status</text>
  <!-- Encoder circles each represent one shaft plus its integrated switch. -->
  <g id="seed"><circle cx="150" cy="170" r="32" class="encoder"/><text x="150" y="176" class="hint">0 / 1 / 2</text><text x="150" y="218" class="label">Seed/Bank</text><text x="150" y="236" class="hint">Hold: reseed</text></g>
  <g id="density"><circle cx="280" cy="170" r="32" class="encoder"/><text x="280" y="176" class="hint">3 / 4 / 5</text><text x="280" y="218" class="label">Density</text></g>
  <g id="tone"><circle cx="440" cy="170" r="32" class="encoder"/><text x="440" y="176" class="hint">24 / 26 / 27</text><text x="440" y="218" class="label">Tone/Tilt</text></g>
  <g id="fx"><circle cx="570" cy="170" r="32" class="encoder"/><text x="570" y="176" class="hint">6 / 9 / 30</text><text x="570" y="218" class="label">FX/Mutate</text></g>
  <g id="tap"><rect x="100" y="250" width="100" height="40" rx="6" class="button"/><text x="150" y="275" class="label">Tap Tempo</text><text x="150" y="307" class="hint">31</text></g>
  <g id="shift"><rect x="240" y="250" width="100" height="40" rx="6" class="button"/><text x="290" y="275" class="label">Shift</text><text x="290" y="307" class="hint">32</text></g>
  <g id="alt"><rect x="380" y="250" width="100" height="40" rx="6" class="button"/><text x="430" y="275" class="label">Alt Seed</text><text x="430" y="307" class="hint">33 · Hold: Storage</text></g>
  <g id="capture"><rect x="520" y="250" width="100" height="40" rx="6" class="button"/><text x="570" y="275" class="label">Live Capture</text><text x="570" y="307" class="hint">34 · Hold: panic</text></g>
  <circle cx="180" cy="350" r="16" class="jack"/><text x="180" y="385" class="hint">TRS MIDI In</text>
  <circle cx="280" cy="350" r="16" class="jack"/><text x="280" y="385" class="hint">TRS MIDI Out</text>
  <circle cx="380" cy="350" r="16" class="jack"/><text x="380" y="385" class="hint">Headphones</text>
  <circle cx="480" cy="350" r="16" class="jack"/><text x="480" y="385" class="hint">USB</text>
  <circle cx="580" cy="350" r="16" class="jack"/><text x="580" y="385" class="hint">DC (optional)</text>
  <text x="360" y="431" class="label">4 encoder/switch assemblies + 4 standalone buttons</text>
  <text x="360" y="454" class="hint">Encoder numbers: A / B / switch GPIO · All switches active-low</text>
  <text x="360" y="476" class="hint">Storage: release Seed/Bank before 450 ms to recall; hold at least 450 ms to save.</text>
  <text x="360" y="499" class="hint">Schematic only · No separate Reseed or Lock button · See PanelControls.h</text>
</svg>
